# Replace server_name and supply certificates using your normal secret management.
# For managed ALB TLS termination, use equivalent target-group and header settings.
server {
    listen 80;
    server_name creatorflow.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name creatorflow.example.com;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 1m;
    # Do not log URLs with OAuth codes, reset tokens or download capabilities.
    access_log off;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
