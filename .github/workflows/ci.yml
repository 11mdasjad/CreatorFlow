name: CreatorFlow checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: creatorflow
          POSTGRES_PASSWORD: creatorflow
          POSTGRES_DB: creatorflow_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U creatorflow -d creatorflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: [6379:6379]
    env:
      DATABASE_URL: postgresql://creatorflow:creatorflow@127.0.0.1:5432/creatorflow_test
      TEST_DATABASE_URL: postgresql://creatorflow:creatorflow@127.0.0.1:5432/creatorflow_test
      APP_URL: http://127.0.0.1:3000
      EMAIL_PROVIDER: local
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate && npm run db:migrate && npm run db:seed
      - run: npm run typecheck && npm test
      - run: npm run build
      - run: npm run db:demo
      - run: npx playwright install --with-deps chromium
      - run: |
          npm run dev > /tmp/creatorflow-dev.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health; then break; fi
            sleep 1
          done
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: creatorflow-verification
          path: |
            playwright-report
            artifacts
